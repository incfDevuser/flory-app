# Config de Supabase para las Edge Functions de Flory.
#
# `project_id` lo escribe `supabase link --project-ref <ref>` en local; se deja vacío
# a propósito para no fijar un proyecto en el repo.
project_id = "flory"

# --- Edge Functions -------------------------------------------------------------
#
# verify_jwt = true: la plataforma valida el JWT del usuario ANTES de ejecutar la
# función. El cliente lo manda como Bearer solo cuando hay sesión iniciada
# (lib/supabase.ts:27-30); como toda la app está detrás del auth gate, siempre la hay.
# Dentro de la función, el user_id se saca de ese mismo token con
# `admin.auth.getUser(token)`. La llave de OpenAI y la service_role viven solo aquí.

# `import_map` apunta al deno.json compartido (mapea `@supabase/supabase-js` a su
# specifier npm). Sin esto, el bundler remoto —el que se usa cuando Docker no corre—
# no resuelve el import bare de `_shared/supabaseAdmin.ts` y el deploy falla con
# "Relative import path not prefixed". La ruta es relativa a este config.toml.

[functions.diagnose]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.identify]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.confirm-identification]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.chat]
verify_jwt = true
import_map = "./functions/deno.json"
